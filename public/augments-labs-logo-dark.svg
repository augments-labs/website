<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title description">
  <title id="title">Augments Labs</title>
  <desc id="description">The Augments Labs wordmark with an abstract letter A and an added teal element.</desc>

  <!-- The open A is the foundation; the teal corner is the augment that extends it. -->
  <g transform="translate(162 0)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 174 98 46l70 128" stroke="#172033" stroke-width="22"/>
      <path d="M60 126h76" stroke="#172033" stroke-width="18"/>
      <path d="M145 48h31v31" stroke="#008C82" stroke-width="14"/>
    </g>

    <text x="220" y="124" fill="#172033" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-2">Augments</text>
    <text x="224" y="169" fill="#008C82" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="9">LABS</text>
  </g>
</svg>
